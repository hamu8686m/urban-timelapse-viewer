<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tokyo Urban Timelapse - 都内街並み変遷アーカイブ</title>

  <!-- 比較スライダー -->
  <script defer src="https://cdn.jsdelivr.net/npm/img-comparison-slider@8/dist/index.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/img-comparison-slider@8/dist/styles.css" />

  <!-- EXIF解析 -->
  <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

  <!-- 地図 (Leaflet.js) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --border: #23314d;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
      max-width: 950px;
      width: 100%;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.3rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    /* ユーザーが設定する3つのカスタム地点スロット */
    .slot-bar-container {
      max-width: 1000px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .slot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
    }

    .slot-tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .slot-btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .slot-btn:hover, .slot-btn.active {
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border-color: var(--accent);
    }

    .edit-slot-btn {
      font-size: 0.72rem;
      opacity: 0.7;
      text-decoration: underline;
    }

    /* 地点検索バー（都内検索＆手動設定） */
    .search-row {
      display: flex;
      gap: 0.5rem;
      background: rgba(15, 23, 42, 0.6);
      padding: 0.5rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .search-row input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
      padding: 0 0.5rem;
    }

    .search-row button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* メイン2カラム配置 */
    .main-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      max-width: 1000px;
      width: 100%;
    }

    @media (min-width: 860px) {
      .main-container {
        grid-template-columns: 3fr 2fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    /* スライダー */
    .slider-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #000;
    }

    img-comparison-slider {
      width: 100%;
      height: 100%;
      outline: none;
      --divider-color: #fff;
      --divider-width: 2px;
      --default-handle-width: 40px;
    }

    img-comparison-slider img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge {
      position: absolute;
      top: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
      z-index: 10;
      pointer-events: none;
    }

    .badge-past { left: 12px; background: rgba(225, 29, 72, 0.85); }
    .badge-present { right: 12px; background: rgba(14, 165, 233, 0.85); }

    /* アップロード・位置解析セクション */
    .upload-box {
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.5);
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      font-size: 0.85rem;
    }

    .upload-action-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .custom-file-btn {
      background: #2563eb;
      color: #fff;
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .custom-file-btn:hover { background: #1d4ed8; }
    input[type="file"] { display: none; }

    #status-msg {
      font-size: 0.8rem;
      color: var(--accent);
      min-height: 1.4em;
    }

    /* 手動位置指定フォーム（GPSなし時のフォールバック） */
    #manual-geo-form {
      display: none;
      background: rgba(30, 41, 59, 0.8);
      border: 1px dashed var(--accent);
      border-radius: 8px;
      padding: 0.75rem;
      margin-top: 0.3rem;
    }

    #manual-geo-form p {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .inline-search {
      display: flex;
      gap: 0.4rem;
    }

    .inline-search input {
      flex: 1;
      padding: 0.3rem 0.6rem;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    .inline-search button {
      background: var(--accent);
      border: none;
      color: #000;
      font-weight: 600;
      padding: 0.3rem 0.7rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.78rem;
    }

    /* 情報カード */
    .info-box {
      padding: 1.2rem;
      font-size: 0.85rem;
    }

    .info-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
    }

    .info-desc {
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 0.8rem;
    }

    .meta-list {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      font-size: 0.8rem;
      border-top: 1px dashed var(--border);
      padding-top: 0.6rem;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
    }

    .meta-row span:first-child { color: var(--text-muted); }

    /* 地図パネル */
    .map-panel {
      display: flex;
      flex-direction: column;
    }

    #map {
      width: 100%;
      height: 340px;
      background: #020617;
      cursor: crosshair;
    }

    .map-controls {
      padding: 0.8rem 1rem;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
      font-size: 0.8rem;
    }

    .map-layer-btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .map-layer-btn.active {
      background: var(--border);
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <h1>TOKYO URBAN ARCHIVE</h1>
    <p>都内の街並み・建築の変遷ビューア。写真の位置情報または手動検索から過去写真・航空写真を自動連動します。</p>
  </header>

  <!-- ユーザーがカスタムできる3地点スロット -->
  <div class="slot-bar-container">
    <div class="slot-header">
      <span>📍 調査地点スロット（クリックで切替 / 検索でこのスロットを上書き）</span>
      <span style="font-size: 0.75rem; color: var(--text-muted);">※設定はブラウザに自動保存されます</span>
    </div>
    
    <div class="slot-tabs">
      <button class="slot-btn active" id="slot-btn-0" onclick="selectSlot(0)">
        <span id="slot-name-0">地点1: 天王洲アイル</span>
      </button>
      <button class="slot-btn" id="slot-btn-1" onclick="selectSlot(1)">
        <span id="slot-name-1">地点2: 渋谷駅周辺</span>
      </button>
      <button class="slot-btn" id="slot-btn-2" onclick="selectSlot(2)">
        <span id="slot-name-2">地点3: 秋葉原駅前</span>
      </button>
    </div>

    <!-- 選択中のスロットの地点を都内検索で書き換えるバー -->
    <div class="search-row">
      <input type="text" id="place-query" placeholder="選択中スロットの地点を変更（例: 芝浦、新木場、日本橋、神保町...）" />
      <button onclick="searchAndAssignTokyoPlace()">この地点を保存</button>
    </div>
  </div>

  <div class="main-container">
    
    <!-- 左側：Before/After ＆ アップロード -->
    <div class="card">
      <div class="slider-wrapper">
        <span class="badge badge-past" id="past-badge">PAST</span>
        <span class="badge badge-present">PRESENT</span>

        <img-comparison-slider>
          <img id="past-img" slot="first" src="" alt="過去写真" />
          <img id="present-img" slot="second" src="" alt="現在写真" />
        </img-comparison-slider>
      </div>

      <div class="upload-box">
        <div class="upload-action-row">
          <label class="custom-file-btn">
            📷 現在写真をアップロード
            <input type="file" accept="image/*" onchange="handlePhotoUpload(event)" />
          </label>
        </div>

        <div id="status-msg">写真を選択すると、自動で位置を特定して過去写真を検索します。</div>

        <!-- GPSがない場合のフォールバック入力欄 -->
        <div id="manual-geo-form">
          <p>⚠️ <strong>写真にGPS位置情報がありませんでした。</strong><br>場所の名前を入力するか、右の地図上を直接クリックして場所を指定してください。</p>
          <div class="inline-search">
            <input type="text" id="manual-place-input" placeholder="撮影した場所（例: 天王洲ボンドストリート）" />
            <button onclick="resolveManualLocation()">場所を決定</button>
          </div>
        </div>
      </div>

      <div class="info-box">
        <div class="info-title" id="location-name">--</div>
        <div class="info-desc" id="location-desc">--</div>
        <div class="meta-list">
          <div class="meta-row">
            <span>座標</span>
            <span id="meta-coords">--</span>
          </div>
          <div class="meta-row">
            <span>過去写真ソース</span>
            <span id="meta-source">--</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 右側：地図 ＆ 国土地理院年代別空中写真 -->
    <div class="card map-panel">
      <div id="map"></div>
      <div class="map-controls">
        <span style="color: var(--text-muted); font-size: 0.75rem;">空中写真年代:</span>
        <button class="map-layer-btn active" onclick="switchTile('now')">現代</button>
        <button class="map-layer-btn" onclick="switchTile('1988')">1988〜90年</button>
        <button class="map-layer-btn" onclick="switchTile('1974')">1974〜78年</button>
        <button class="map-layer-btn" onclick="switchTile('1961')">1961〜69年</button>
      </div>
    </div>

  </div>

  <script>
    // デフォルトの3地点（都内）
    const DEFAULT_SLOTS = [
      {
        name: "天王洲アイル（臨海倉庫街・再生）",
        desc: "沿岸流通倉庫群からアート・運河景観地区へとリノベーションされた臨海都市エリア。",
        lat: 35.6225,
        lng: 139.7505,
        pastImg: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Tennozu_Isle_1992.jpg/1024px-Tennozu_Isle_1992.jpg",
        presentImg: "https://images.unsplash.com/photo-1542051841857-5f90071e7989?auto=format&fit=crop&w=1200&q=80",
        pastLabel: "PAST (1992)",
        source: "Wikimedia Commons"
      },
      {
        name: "渋谷駅周辺・高層再開発",
        desc: "東急東横線ホーム地下化および渋谷川再生、超高層複合施設群への全面刷新。",
        lat: 35.6580,
        lng: 139.7016,
        pastImg: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Tokyu_Toyoko_Line_Shibuya_Station_Platform.jpg/1024px-Tokyu_Toyoko_Line_Shibuya_Station_Platform.jpg",
        presentImg: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=1200&q=80",
        pastLabel: "PAST (2008)",
        source: "Wikimedia Commons"
      },
      {
        name: "秋葉原駅前・電気街地区",
        desc: "旧貨物ヤード跡地の再開発と、電気街からIT・カルチャー拠点への変遷。",
        lat: 35.6983,
        lng: 139.7731,
        pastImg: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b2/Akihabara_1985.jpg/1024px-Akihabara_1985.jpg",
        presentImg: "https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=1200&q=80",
        pastLabel: "PAST (1985)",
        source: "Wikimedia Commons"
      }
    ];

    // LocalStorageから3地点データを読み込み
    let userSlots = JSON.parse(localStorage.getItem('tokyo_urban_slots')) || DEFAULT_SLOTS;
    let activeSlotIndex = 0;

    // 地図とタイルの初期化
    let map, currentMarker;
    const tileLayers = {
      now: L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {
        attribution: '&copy; 国土地理院 (最新空中写真)',
        maxZoom: 18
      }),
      '1988': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/gazo4/{z}/{x}/{y}.jpg', {
        attribution: '&copy; 国土地理院 (1988〜1990年)',
        maxZoom: 17
      }),
      '1974': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/gazo1/{z}/{x}/{y}.jpg', {
        attribution: '&copy; 国土地理院 (1974〜1978年)',
        maxZoom: 17
      }),
      '1961': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/ort_old10/{z}/{x}/{y}.png', {
        attribution: '&copy; 国土地理院 (1961〜1969年)',
        maxZoom: 17
      })
    };
    let activeTileKey = 'now';

    function initMap(lat, lng) {
      map = L.map('map').setView([lat, lng], 15);
      tileLayers[activeTileKey].addTo(map);
      currentMarker = L.marker([lat, lng]).addTo(map);

      // 地図クリックで手動位置指定も可能にする
      map.on('click', function(e) {
        applyCoordinates(e.latlng.lat, e.latlng.lng, "地図クリック指定地点");
      });
    }

    function switchTile(key) {
      if (map && tileLayers[key]) {
        map.removeLayer(tileLayers[activeTileKey]);
        tileLayers[key].addTo(map);
        activeTileKey = key;
        document.querySelectorAll('.map-layer-btn').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('onclick').includes(key));
        });
      }
    }

    // スロット切り替え
    function selectSlot(index) {
      activeSlotIndex = index;
      renderSlotUI();
      applySlotData(userSlots[index]);
    }

    function renderSlotUI() {
      for (let i = 0; i < 3; i++) {
        const btn = document.getElementById(`slot-btn-${i}`);
        const nameSpan = document.getElementById(`slot-name-${i}`);
        btn.classList.toggle('active', i === activeSlotIndex);
        nameSpan.textContent = `地点${i + 1}: ${userSlots[i].name.slice(0, 10)}`;
      }
    }

    function applySlotData(data) {
      document.getElementById('past-img').src = data.pastImg || "";
      document.getElementById('present-img').src = data.presentImg || "";
      document.getElementById('past-badge').textContent = data.pastLabel || "PAST";
      document.getElementById('location-name').textContent = data.name;
      document.getElementById('location-desc').textContent = data.desc;
      document.getElementById('meta-coords').textContent = `${data.lat.toFixed(4)}, ${data.lng.toFixed(4)}`;
      document.getElementById('meta-source').textContent = data.source || "アーカイブ";

      if (!map) {
        initMap(data.lat, data.lng);
      } else {
        map.setView([data.lat, data.lng], 15);
        currentMarker.setLatLng([data.lat, data.lng]);
      }
    }

    // 都内の地名検索（Nominatim API・東京にバウンディング）
    async function searchAndAssignTokyoPlace() {
      const query = document.getElementById('place-query').value.trim();
      if (!query) return;

      const status = document.getElementById('status-msg');
      status.textContent = `「${query}」の位置を検索中...`;

      try {
        // 都内優先検索
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=東京都+${encodeURIComponent(query)}&limit=1`;
        const res = await fetch(url);
        const data = await res.json();

        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lng = parseFloat(data[0].lon);
          const name = query;

          // 現在のスロットを更新して保存
          userSlots[activeSlotIndex] = {
            name: name,
            desc: `東京都内「${name}」の変遷。航空写真や周辺アーカイブ写真を参照しています。`,
            lat: lat,
            lng: lng,
            pastImg: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Tennozu_Isle_1992.jpg/1024px-Tennozu_Isle_1992.jpg",
            presentImg: "https://images.unsplash.com/photo-1542051841857-5f90071e7989?auto=format&fit=crop&w=1200&q=80",
            pastLabel: "PAST",
            source: "国土地理院・Wikimedia"
          };

          localStorage.setItem('tokyo_urban_slots', JSON.stringify(userSlots));
          renderSlotUI();
          applySlotData(userSlots[activeSlotIndex]);

          // 周辺の過去写真も再検索
          searchWikimediaHistoricalPhotos(lat, lng);
          status.textContent = `✅ 地点${activeSlotIndex + 1}を「${name}」に更新・保存しました。`;
          document.getElementById('place-query').value = "";
        } else {
          status.textContent = `⚠️ 「${query}」の位置が見つかりませんでした。別の名称でお試しください。`;
        }
      } catch (e) {
        status.textContent = "検索エラーが発生しました。";
      }
    }

    // 写真アップロード時の処理（EXIF解析 ＆ GPSなし時のフォールバック）
    function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const status = document.getElementById('status-msg');
      const manualForm = document.getElementById('manual-geo-form');
      status.textContent = "写真を解析中...";
      manualForm.style.display = "none";

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('present-img').src = e.target.result;

        EXIF.getData(file, function() {
          const lat = EXIF.getTag(this, "GPSLatitude");
          const lon = EXIF.getTag(this, "GPSLongitude");
          const latRef = EXIF.getTag(this, "GPSLatitudeRef") || "N";
          const lonRef = EXIF.getTag(this, "GPSLongitudeRef") || "E";

          if (lat && lon) {
            const decLat = convertDMSToDD(lat[0], lat[1], lat[2], latRef);
            const decLng = convertDMSToDD(lon[0], lon[1], lon[2], lonRef);
            applyCoordinates(decLat, decLng, "撮影写真（EXIF自動特定）");
          } else {
            status.textContent = "⚠️ 写真にGPS位置情報がありませんでした。下の入力欄または地図をクリックして場所を指定してください。";
            manualForm.style.display = "block";
          }
        });
      };
      reader.readAsDataURL(file);
    }

    // DMSを十進に変換
    function convertDMSToDD(degrees, minutes, seconds, direction) {
      let dd = degrees + minutes / 60 + seconds / (60 * 60);
      if (direction === "S" || direction === "W") dd = dd * -1;
      return dd;
    }

    // 手動地名解決（GPSがなかった場合の入力）
    async function resolveManualLocation() {
      const input = document.getElementById('manual-place-input').value.trim();
      if (!input) return;

      const status = document.getElementById('status-msg');
      status.textContent = `「${input}」の位置を特定中...`;

      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=東京都+${encodeURIComponent(input)}&limit=1`;
        const res = await fetch(url);
        const data = await res.json();
        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lng = parseFloat(data[0].lon);
          document.getElementById('manual-geo-form').style.display = "none";
          applyCoordinates(lat, lng, `手動指定: ${input}`);
        } else {
          status.textContent = `「${input}」が見つかりませんでした。より具体的な駅名や施設名で入力してください。`;
        }
      } catch (e) {
        status.textContent = "位置特定中にエラーが発生しました。";
      }
    }

    // 座標が確定した共通処理
    function applyCoordinates(lat, lng, labelName) {
      const status = document.getElementById('status-msg');
      status.textContent = `📍 座標特定 [${lat.toFixed(4)}, ${lng.toFixed(4)}]：周辺の過去写真を検索中...`;

      document.getElementById('meta-coords').textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
      document.getElementById('location-name').textContent = labelName;

      // 現在のスロットに座標を反映
      userSlots[activeSlotIndex].lat = lat;
      userSlots[activeSlotIndex].lng = lng;
      userSlots[activeSlotIndex].name = labelName;
      localStorage.setItem('tokyo_urban_slots', JSON.stringify(userSlots));
      renderSlotUI();

      map.setView([lat, lng], 16);
      currentMarker.setLatLng([lat, lng]);

      // 過去写真検索
      searchWikimediaHistoricalPhotos(lat, lng);
    }

    // Wikimedia Commons APIで近隣写真検索
    async function searchWikimediaHistoricalPhotos(lat, lng) {
      const status = document.getElementById('status-msg');
      try {
        const radius = 1000; // 半径1km
        const url = `https://commons.wikimedia.org/w/api.php?origin=*&action=query&list=geosearch&gsprimary=all&gsnamespace=6&gscoord=${lat}|${lng}&gsradius=${radius}&gslimit=10&format=json`;

        const res = await fetch(url);
        const data = await res.json();
        const results = data.query?.geosearch;

        if (results && results.length > 0) {
          fetchImageDetails(results[0].pageid);
        } else {
          status.textContent = "指定座標の近隣に地上写真が見つかりませんでした。右側の「1988年」「1974年」等の空中写真で変遷をご確認ください。";
        }
      } catch (err) {
        status.textContent = "アーカイブ検索中にエラーが発生しました。";
      }
    }

    async function fetchImageDetails(pageId) {
      const status = document.getElementById('status-msg');
      const url = `https://commons.wikimedia.org/w/api.php?origin=*&action=query&pageids=${pageId}&prop=imageinfo&iiprop=url|extmetadata&format=json`;
      const res = await fetch(url);
      const data = await res.json();
      const info = data.query?.pages[pageId]?.imageinfo?.[0];

      if (info && info.url) {
        document.getElementById('past-img').src = info.url;
        const date = info.extmetadata?.DateTimeOriginal?.value || "ARCHIVE";
        document.getElementById('past-badge').textContent = `PAST (${date.slice(0, 4)})`;
        document.getElementById('meta-source').textContent = `Wikimedia: ${data.query.pages[pageId].title}`;
        status.textContent = `✅ 周辺のアーカイブ写真をセットしました（${date.slice(0, 4)}年頃）`;
      }
    }

    // 起動時
    window.addEventListener('DOMContentLoaded', () => {
      renderSlotUI();
      selectSlot(0);
    });
  </script>

</body>
</html>
