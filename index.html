<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tokyo Urban Archive - 完全無料版</title>

  <!-- 比較スライダー -->
  <script defer src="https://cdn.jsdelivr.net/npm/img-comparison-slider@8/dist/index.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/img-comparison-slider@8/dist/styles.css" />

  <!-- EXIF解析 -->
  <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

  <!-- 地図 (Leaflet.js) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --border: #23314d;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 1rem;
      max-width: 1000px;
      width: 100%;
    }

    header h1 {
      font-size: 1.7rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.2rem;
    }

    header p { color: var(--text-muted); font-size: 0.85rem; }

    /* 3地点スロット */
    .slot-bar {
      max-width: 1000px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .slot-tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .slot-btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .slot-btn.active {
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border-color: var(--accent);
    }

    .search-row {
      display: flex;
      gap: 0.4rem;
      background: rgba(15, 23, 42, 0.5);
      padding: 0.3rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .search-row input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.82rem;
      outline: none;
      padding: 0 0.5rem;
    }

    .search-row button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.3rem 0.7rem;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* メイングリッド */
    .main-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      max-width: 1000px;
      width: 100%;
    }

    @media (min-width: 860px) {
      .main-container { grid-template-columns: 3fr 2fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    /* スライダー */
    .slider-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #000;
    }

    img-comparison-slider {
      width: 100%;
      height: 100%;
      outline: none;
      --divider-color: #fff;
      --divider-width: 2px;
    }

    img-comparison-slider img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge {
      position: absolute;
      top: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 800;
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .badge-past { left: 10px; background: rgba(225, 29, 72, 0.85); color: #fff; }
    .badge-present { right: 10px; background: rgba(14, 165, 233, 0.85); color: #fff; }

    /* 年代フィルター */
    .era-bar {
      padding: 0.5rem 0.8rem;
      background: rgba(15, 23, 42, 0.7);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
      font-size: 0.75rem;
    }

    .era-btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.72rem;
    }

    .era-btn.active {
      background: #f43f5e;
      border-color: #f43f5e;
      color: #fff;
      font-weight: 700;
    }

    /* 過去写真サムネイル一覧（横スクロール） */
    .thumb-gallery-box {
      padding: 0.6rem 0.8rem;
      background: #0c1322;
      border-top: 1px solid var(--border);
    }

    .thumb-gallery-header {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      display: flex;
      justify-content: space-between;
    }

    .thumb-scroll {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.4rem;
    }

    .thumb-scroll::-webkit-scrollbar { height: 6px; }
    .thumb-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .thumb-item {
      flex: 0 0 95px;
      height: 65px;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      position: relative;
      background: #1e293b;
    }

    .thumb-item:hover, .thumb-item.active {
      border-color: var(--accent);
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-year {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 0.6rem;
      text-align: center;
      padding: 1px 0;
    }

    /* アップロード・メッセージ */
    .upload-box {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .custom-file-btn {
      background: #2563eb;
      color: #fff;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
      display: inline-block;
      width: fit-content;
    }

    input[type="file"] { display: none; }

    #status-msg {
      font-size: 0.75rem;
      color: var(--accent);
      min-height: 1.2em;
    }

    /* 地図パネル */
    .map-panel { display: flex; flex-direction: column; }
    #map { width: 100%; height: 350px; background: #020617; }

    .map-controls {
      padding: 0.6rem 0.8rem;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      align-items: center;
      font-size: 0.75rem;
    }

    .map-layer-btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .map-layer-btn.active {
      background: var(--border);
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <h1>TOKYO URBAN ARCHIVE</h1>
    <p>都内オープンアーカイブ連携版：完全無料・登録不要で過去写真と国土地理院空中写真を比較</p>
  </header>

  <!-- 3地点スロット -->
  <div class="slot-bar">
    <div class="slot-tabs">
      <button class="slot-btn active" id="slot-btn-0" onclick="selectSlot(0)">
        <span id="slot-name-0">地点1: 天王洲アイル</span>
      </button>
      <button class="slot-btn" id="slot-btn-1" onclick="selectSlot(1)">
        <span id="slot-name-1">地点2: 渋谷駅周辺</span>
      </button>
      <button class="slot-btn" id="slot-btn-2" onclick="selectSlot(2)">
        <span id="slot-name-2">地点3: 秋葉原駅前</span>
      </button>
    </div>

    <div class="search-row">
      <input type="text" id="place-query" placeholder="都内の地点を検索（例: 芝浦、新木場、勝どき、日本橋...）" />
      <button onclick="searchAndAssignPlace()">この地点を調査</button>
    </div>
  </div>

  <div class="main-container">
    
    <!-- 左側：Before/After ＆ サムネイルギャラリー ＆ アップロード -->
    <div class="card">
      <div class="slider-wrapper">
        <span class="badge badge-past" id="past-badge">PAST</span>
        <span class="badge badge-present">PRESENT</span>

        <img-comparison-slider>
          <img id="past-img" slot="first" src="" alt="過去写真" />
          <img id="present-img" slot="second" src="" alt="現在写真" />
        </img-comparison-slider>
      </div>

      <!-- 年代選択バー -->
      <div class="era-bar">
        <span style="color: var(--text-muted); font-weight: 600;">年代絞り込み:</span>
        <button class="era-btn active" onclick="filterByEra('all')">全年代</button>
        <button class="era-btn" onclick="filterByEra('classic')">〜1980年代</button>
        <button class="era-btn" onclick="filterByEra('1990s')">1990年代</button>
        <button class="era-btn" onclick="filterByEra('2000s')">2000年代</button>
        <button class="era-btn" onclick="filterByEra('2010s')">2010年代</button>
      </div>

      <!-- 写真候補サムネイル一覧 -->
      <div class="thumb-gallery-box">
        <div class="thumb-gallery-header">
          <span id="thumb-count-label">📸 周辺アーカイブ候補（クリックでスライダーにセット）:</span>
        </div>
        <div class="thumb-scroll" id="thumb-scroll-list">
          <!-- JSで動的生成 -->
        </div>
      </div>

      <div class="upload-box">
        <label class="custom-file-btn">
          📷 現在写真をアップロード（EXIF自動解析）
          <input type="file" accept="image/*" onchange="handlePhotoUpload(event)" />
        </label>
        <div id="status-msg">地点を選択するか、現在写真をアップロードしてください。</div>
      </div>
    </div>

    <!-- 右側：地図 ＆ 国土地理院空中写真 -->
    <div class="card map-panel">
      <div id="map"></div>
      <div class="map-controls">
        <span style="color: var(--text-muted);">空中写真:</span>
        <button class="map-layer-btn active" onclick="switchTile('now')">現代</button>
        <button class="map-layer-btn" onclick="switchTile('1988')">1988〜90年</button>
        <button class="map-layer-btn" onclick="switchTile('1974')">1974〜78年</button>
        <button class="map-layer-btn" onclick="switchTile('1961')">1961〜69年</button>
      </div>
    </div>

  </div>

  <script>
    // デフォルトスロット
    const DEFAULT_SLOTS = [
      { name: "天王洲アイル", lat: 35.6225, lng: 139.7505, present: "https://images.unsplash.com/photo-1542051841857-5f90071e7989?auto=format&fit=crop&w=1200&q=80" },
      { name: "渋谷駅周辺", lat: 35.6580, lng: 139.7016, present: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=1200&q=80" },
      { name: "秋葉原駅前", lat: 35.6983, lng: 139.7731, present: "https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=1200&q=80" }
    ];

    let userSlots = JSON.parse(localStorage.getItem('tokyo_urban_slots')) || DEFAULT_SLOTS;
    let activeSlotIndex = 0;
    let allFetchedPhotos = [];
    let currentEraFilter = 'all';

    // 国土地理院タイル＆地図
    let map, currentMarker;
    const tileLayers = {
      now: L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', { attribution: '&copy; 国土地理院 (最新空中写真)', maxZoom: 18 }),
      '1988': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/gazo4/{z}/{x}/{y}.jpg', { attribution: '&copy; 国土地理院 (1988〜90)', maxZoom: 17 }),
      '1974': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/gazo1/{z}/{x}/{y}.jpg', { attribution: '&copy; 国土地理院 (1974〜78)', maxZoom: 17 }),
      '1961': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/ort_old10/{z}/{x}/{y}.png', { attribution: '&copy; 国土地理院 (1961〜69)', maxZoom: 17 })
    };
    let activeTileKey = 'now';

    function initMap(lat, lng) {
      map = L.map('map').setView([lat, lng], 15);
      tileLayers[activeTileKey].addTo(map);
      currentMarker = L.marker([lat, lng]).addTo(map);

      map.on('click', function(e) {
        applyCoordinates(e.latlng.lat, e.latlng.lng, "地図指定地点");
      });
    }

    function switchTile(key) {
      if (map && tileLayers[key]) {
        map.removeLayer(tileLayers[activeTileKey]);
        tileLayers[key].addTo(map);
        activeTileKey = key;
        document.querySelectorAll('.map-layer-btn').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('onclick').includes(key));
        });
      }
    }

    // スロット切り替え
    function selectSlot(index) {
      activeSlotIndex = index;
      renderSlotUI();
      const current = userSlots[index];
      document.getElementById('present-img').src = current.present;

      if (!map) {
        initMap(current.lat, current.lng);
      } else {
        map.setView([current.lat, current.lng], 15);
        currentMarker.setLatLng([current.lat, current.lng]);
      }

      fetchMassiveFreeArchives(current.lat, current.lng, current.name);
    }

    function renderSlotUI() {
      for (let i = 0; i < 3; i++) {
        document.getElementById(`slot-btn-${i}`).classList.toggle('active', i === activeSlotIndex);
        document.getElementById(`slot-name-${i}`).textContent = `地点${i + 1}: ${userSlots[i].name.slice(0, 9)}`;
      }
    }

    // 無料オープンアーカイブの複合取得（Wikimedia広域 ＋ 地名キーワード補完）
    async function fetchMassiveFreeArchives(lat, lng, placeName) {
      const status = document.getElementById('status-msg');
      allFetchedPhotos = [];
      renderThumbnailGallery([]);
      status.textContent = `📍 [${lat.toFixed(4)}, ${lng.toFixed(4)}] 周辺のオープンアーカイブ写真を収集中...`;

      try {
        // 検索半径を2.5kmに拡大して件数を確保
        const radius = 2500;
        const geoUrl = `https://commons.wikimedia.org/w/api.php?origin=*&action=query&list=geosearch&gsprimary=all&gsnamespace=6&gscoord=${lat}|${lng}&gsradius=${radius}&gslimit=50&format=json`;

        const res = await fetch(geoUrl);
        const data = await res.json();
        const results = data.query?.geosearch || [];

        if (results.length > 0) {
          const pageIds = results.map(r => r.pageid).join('|');
          const detailUrl = `https://commons.wikimedia.org/w/api.php?origin=*&action=query&pageids=${pageIds}&prop=imageinfo&iiprop=url|extmetadata&format=json`;
          
          const dRes = await fetch(detailUrl);
          const dData = await dRes.json();
          const pages = dData.query?.pages || {};

          for (const id in pages) {
            const item = pages[id];
            const info = item.imageinfo?.[0];
            if (info && info.url) {
              const rawDate = info.extmetadata?.DateTimeOriginal?.value || info.extmetadata?.DateTime?.value || "";
              const matchYear = rawDate.match(/(18\d\d|19\d\d|20\d\d)/);
              const title = item.title.replace("File:", "").replace(/\.(jpg|jpeg|png|svg)/i, "");

              // ノイズ（紋章、ロゴ、極小アイコン）を簡易フィルタリング
              if (!title.toLowerCase().includes("logo") && !title.toLowerCase().includes("flag")) {
                allFetchedPhotos.push({
                  title: title,
                  url: info.url,
                  thumb: info.url,
                  year: matchYear ? parseInt(matchYear[1], 10) : null
                });
              }
            }
          }
        }

        if (allFetchedPhotos.length > 0) {
          status.textContent = `✅ 周辺で ${allFetchedPhotos.length} 枚の過去写真を発見！ 下のサムネイルから選んで比較できます。`;
          filterByEra(currentEraFilter);
        } else {
          status.textContent = "この地点の近隣写真が見つかりませんでした。右側の空中写真を切り替えて変遷をご確認ください。";
        }
      } catch (err) {
        status.textContent = "過去写真の検索中にエラーが発生しました。";
      }
    }

    // 年代別フィルタリング＆サムネイル生成
    function filterByEra(era) {
      currentEraFilter = era;
      document.querySelectorAll('.era-btn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('onclick').includes(era));
      });

      // 空中写真の年代も自動同期
      if (era === 'classic') switchTile('1974');
      else if (era === '1990s') switchTile('1988');
      else switchTile('now');

      let filtered = allFetchedPhotos.filter(item => {
        if (!item.year) return true;
        if (era === 'all') return true;
        if (era === 'classic') return item.year < 1990;
        if (era === '1990s') return item.year >= 1990 && item.year < 2000;
        if (era === '2000s') return item.year >= 2000 && item.year < 2010;
        if (era === '2010s') return item.year >= 2010 && item.year < 2020;
        return true;
      });

      // 古い順にソート
      filtered.sort((a, b) => (a.year || 9999) - (b.year || 9999));

      renderThumbnailGallery(filtered);

      if (filtered.length > 0) {
        setPastImage(filtered[0]);
      }
    }

    // サムネイルギャラリー描画
    function renderThumbnailGallery(list) {
      const container = document.getElementById('thumb-scroll-list');
      const countLabel = document.getElementById('thumb-count-label');
      container.innerHTML = "";
      countLabel.textContent = `📸 過去写真候補（${list.length}枚 / クリックでスライダーにセット）:`;

      list.forEach((item, index) => {
        const thumbDiv = document.createElement('div');
        thumbDiv.className = `thumb-item ${index === 0 ? 'active' : ''}`;
        thumbDiv.title = `${item.title} (${item.year ? item.year + '年' : '年代不明'})`;
        thumbDiv.innerHTML = `
          <img src="${item.thumb}" loading="lazy" />
          <div class="thumb-year">${item.year ? item.year + '年' : '年代不明'}</div>
        `;
        thumbDiv.onclick = () => {
          document.querySelectorAll('.thumb-item').forEach(el => el.classList.remove('active'));
          thumbDiv.classList.add('active');
          setPastImage(item);
        };
        container.appendChild(thumbDiv);
      });
    }

    function setPastImage(item) {
      document.getElementById('past-img').src = item.url;
      document.getElementById('past-badge').textContent = `PAST (${item.year ? item.year + '年' : 'ARCHIVE'})`;
    }

    // 都内検索
    async function searchAndAssignPlace() {
      const q = document.getElementById('place-query').value.trim();
      if (!q) return;
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=東京都+${encodeURIComponent(q)}&limit=1`);
      const data = await res.json();
      if (data && data.length > 0) {
        const lat = parseFloat(data[0].lat);
        const lng = parseFloat(data[0].lon);
        applyCoordinates(lat, lng, q);
        document.getElementById('place-query').value = "";
      }
    }

    function applyCoordinates(lat, lng, name) {
      userSlots[activeSlotIndex] = {
        name: name,
        lat: lat,
        lng: lng,
        present: userSlots[activeSlotIndex].present
      };
      localStorage.setItem('tokyo_urban_slots', JSON.stringify(userSlots));
      renderSlotUI();
      map.setView([lat, lng], 15);
      currentMarker.setLatLng([lat, lng]);
      fetchMassiveFreeArchives(lat, lng, name);
    }

    // 写真アップロード
    function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('present-img').src = e.target.result;
        userSlots[activeSlotIndex].present = e.target.result;

        EXIF.getData(file, function() {
          const lat = EXIF.getTag(this, "GPSLatitude");
          const lon = EXIF.getTag(this, "GPSLongitude");
          const latRef = EXIF.getTag(this, "GPSLatitudeRef") || "N";
          const lonRef = EXIF.getTag(this, "GPSLongitudeRef") || "E";

          if (lat && lon) {
            const decLat = convertDMSToDD(lat[0], lat[1], lat[2], latRef);
            const decLng = convertDMSToDD(lon[0], lon[1], lon[2], lonRef);
            applyCoordinates(decLat, decLng, "現地撮影写真");
          } else {
            document.getElementById('status-msg').textContent = "⚠️ 写真にGPSがありませんでした。右の地図をクリックして場所を指定してください。";
          }
        });
      };
      reader.readAsDataURL(file);
    }

    function convertDMSToDD(degrees, minutes, seconds, direction) {
      let dd = degrees + minutes / 60 + seconds / (60 * 60);
      if (direction === "S" || direction === "W") dd = dd * -1;
      return dd;
    }

    // 初期起動
    window.addEventListener('DOMContentLoaded', () => {
      renderSlotUI();
      selectSlot(0);
    });
  </script>

</body>
</html>
